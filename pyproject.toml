[project]
name = "lookerctl"
version = "0.1.0"
description = "A lightweight CLI and MCP server for automating Looker workflows, CI pipelines, and AI-assisted LookML development."
requires-python = ">=3.10"
dependencies = [
    "looker-sdk>=24.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "gitpython>=3.1.0",
    "lkml>=1.3.0",
    "networkx>=3.0.0",
    "python-dotenv>=1.0.0",
    "shandy-sqlfmt[jinjafmt]==0.27.0",
    "PyYAML>=6.0.0",
    "mcp>=1",
]

[tool.ruff]
line-length = 100
target-version = "py310"
