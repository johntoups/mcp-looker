[project]
name = "lookerctl"
version = "0.1.0"
description = "A lightweight CLI and MCP server for automating Looker workflows, CI pipelines, and AI-assisted LookML development."
keywords = ["looker", "lookml", "lkml"]
readme = "README.md"
authors = [{ name = "z3z1ma", email = "butler.alex2010@gmail.com" }]
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "looker-sdk>=24.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "gitpython>=3.1.0",
    "lkml>=1.3.0",
    "networkx>=3.0.0",
    "python-dotenv>=1.0.0",
    "shandy-sqlfmt[jinjafmt]==0.27.0",
    "PyYAML>=6.0.0",
    "mcp>=1",
]

[tool.ruff]
line-length = 100
target-version = "py310"
preview = true

[project.scripts]
lookerctl = "lookerctl.cli:cli"
lookerfmt = "lookerctl.format_sql:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
